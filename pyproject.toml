[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haggatrons"
version = "0.1.0"
description = "Two camera robot workers coordinated with Flower"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr[simulation]>=1.38.0,<2.0"]

[project.optional-dependencies]
camera = ["Pillow>=10,<13", "pyserial>=3.5,<4"]

[tool.hatch.build.targets.wheel]
packages = ["flower_explore"]

[tool.flwr.app]
publisher = "local"
fab-format-version = 1
flwr-version-target = "1.38.0"
fab-include = ["flower_explore/**/*.py", "sim.py", "LICENSE"]

[tool.flwr.app.components]
serverapp = "flower_explore.server_app:app"
clientapp = "flower_explore.client_app:app"

[tool.flwr.app.config]
steps = 30
vlm-frame = ""
